# =============================================================================
# Lefthook Configuration - Pre-commit Hooks
# Tools: Semgrep (SAST) + Trivy (Vulnerability Scanner) + Maven Test
# =============================================================================

pre-commit:
  parallel: true

  commands:
    # -------------------------------------------------------------------------
    # Semgrep - Static Application Security Testing (SAST)
    # -------------------------------------------------------------------------
#    semgrep:
#      glob: "*.{java,xml,yml,yaml,properties}"
#      run: >
#        semgrep scan
#        --config .semgrep/
#        --error
#        --severity ERROR
#        --timeout 60
#        --no-git-ignore
#        {staged_files}
#      fail_text: |
#        Semgrep found security issues! Fix findings above before committing.

    # -------------------------------------------------------------------------
    # Trivy - Vulnerability & Secret Scanner
    # -------------------------------------------------------------------------
    trivy:
      glob: "*.{java,xml,gradle,yml,yaml,properties,Dockerfile}"
      run: >
        trivy fs
        --config /lefthook/trivy/trivy.yaml
        .
      fail_text: |
        Trivy found HIGH/CRITICAL vulnerabilities or secrets!
        Review findings above. If false positive, add to .trivyignore with justification.

